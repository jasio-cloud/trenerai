name: Trener AI — pingi na telefon

# Ten workflow zastępuje włączony komputer. Leci w chmurze GitHuba i PLANUJE
# powiadomienia z góry: ntfy przyjmuje wiadomość teraz i dostarcza ją o zadanej
# godzinie co do minuty.
#
# Dlaczego nie sprawdzamy po prostu "co wypada teraz": darmowy cron GitHuba nie
# dotrzymuje harmonogramu. Zmierzone na tym repo — 24 przebiegi w 45 godzin,
# czyli realnie raz na ~2 godziny zamiast co 10 minut. Przy sprawdzaniu okienkiem
# prawie każdy punkt planu przepadał. Przy planowaniu z góry wystarczy, że zadanie
# odpali się raz na kilka godzin, a pingi i tak przychodzą punktualnie.

on:
  schedule:
    - cron: "*/10 * * * *"
  # Wyzwalacz na push daje dwie rzeczy: natychmiastowy sprawdzian po każdej
  # zmianie oraz awaryjną drogę, gdy GitHub wyłączy harmonogram (robi to
  # w repozytoriach nieaktywnych ponad 60 dni). paths-ignore odcina pętlę,
  # bo workflow sam commituje do state/ i docs/dane.json.
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
      - "docs/dane.json"
  # Panel po kazdym zapisie (odhaczenie, podmiana, pauza, start od zera) budzi
  # workflow od razu. Bez tego zmiana z telefonu czekalaby na kolejny przebieg
  # crona, a ten przychodzi srednio co ~3,5 h.
  repository_dispatch:
    types: [panel]
  workflow_dispatch:
    inputs:
      test:
        description: "Wyślij ping testowy zamiast normalnego sprawdzenia"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trener-tick
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # ref: main, a NIE domyslny sha z chwili zlecenia przebiegu. Przebiegi stoja
      # w kolejce (concurrency), a GitHub dawal im stan repo sprzed zapisow poprzednika:
      # taki przebieg nie widzial zaplanowanych pingow i planowal je drugi raz.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ping testowy
        if: inputs.test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python trener.py test


      - name: Zastosuj to, co przyszło z telefonu
        if: ${{ !inputs.test }}
        run: python trener.py przetworz

      - name: Zaplanuj pingi na dziś i jutro (plus nadrobienie zaległych)
        if: ${{ !inputs.test }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python trener.py tick

      - name: Zaksięguj zakupy i zużycie (w dniu gotowania, po 15:30)
        if: ${{ !inputs.test }}
        run: python trener.py auto

      - name: Odśwież dane dla panelu
        if: ${{ !inputs.test }}
        run: python trener.py eksport

      - name: Zapisz stan z powrotem do repo
        if: ${{ !inputs.test }}
        run: |
          git config user.name "trener-ai"
          git config user.email "trener-ai@users.noreply.github.com"
          git add state docs/dane.json
          if git diff --cached --quiet; then
            echo "Nic się nie zmieniło — bez commita."
          else
            git commit -m "stan: $(date -u +%F\ %H:%M) UTC"
            # ktoś (Ty z komputera) mógł commitować w międzyczasie
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
